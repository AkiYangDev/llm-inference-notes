<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">专家计算同为 3 ms，通信区间仍会因晚到而不同</title>
<desc id="desc">教学时间线。rank0两毫秒就绪，等到第五毫秒；rank1五毫秒就绪。传输五到六，GEMM六到九，combine九到十毫秒。</desc>
<rect width="1100" height="460" rx="18" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17304b">
<text x="35" y="43" font-size="24" font-weight="700">专家 GEMM 一样快，先到的 rank 却等得更久</text>
<text x="35" y="77" font-size="18">教学设定：专家分组相同；两端都准备好后传输 1 ms</text>
<line x1="155" x2="155" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="155" y="318" text-anchor="middle" font-size="17">0</text>
<line x1="315" x2="315" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="315" y="318" text-anchor="middle" font-size="17">2</text>
<line x1="555" x2="555" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="555" y="318" text-anchor="middle" font-size="17">5</text>
<line x1="635" x2="635" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="635" y="318" text-anchor="middle" font-size="17">6</text>
<line x1="875" x2="875" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="875" y="318" text-anchor="middle" font-size="17">9</text>
<line x1="955" x2="955" y1="115" y2="293" stroke="#c6d1dd" stroke-dasharray="4 4"/>
<text x="955" y="318" text-anchor="middle" font-size="17">10</text>
<text x="35" y="165" font-size="22" font-weight="700">rank 0</text>
<rect x="155" y="135" width="160" height="49" fill="#caddec" stroke="#f4f7fb" stroke-width="2"/>
<text x="235.0" y="166" text-anchor="middle" font-size="17">准备输入</text>
<rect x="315" y="135" width="240" height="49" fill="#f4cba5" stroke="#f4f7fb" stroke-width="2"/>
<text x="435.0" y="166" text-anchor="middle" font-size="17">等对端</text>
<rect x="555" y="135" width="80" height="49" fill="#82b6ca" stroke="#f4f7fb" stroke-width="2"/>
<text x="595.0" y="166" text-anchor="middle" font-size="17">传输</text>
<rect x="635" y="135" width="240" height="49" fill="#98c3a4" stroke="#f4f7fb" stroke-width="2"/>
<text x="755.0" y="166" text-anchor="middle" font-size="17">GEMM</text>
<rect x="875" y="135" width="80" height="49" fill="#bdafcf" stroke="#f4f7fb" stroke-width="2"/>
<text x="915.0" y="166" text-anchor="middle" font-size="17">合并</text>
<text x="35" y="260" font-size="22" font-weight="700">rank 1</text>
<rect x="155" y="230" width="400" height="49" fill="#caddec" stroke="#f4f7fb" stroke-width="2"/>
<text x="355.0" y="261" text-anchor="middle" font-size="17">准备输入</text>
<rect x="555" y="230" width="80" height="49" fill="#82b6ca" stroke="#f4f7fb" stroke-width="2"/>
<text x="595.0" y="261" text-anchor="middle" font-size="17">传输</text>
<rect x="635" y="230" width="240" height="49" fill="#98c3a4" stroke="#f4f7fb" stroke-width="2"/>
<text x="755.0" y="261" text-anchor="middle" font-size="17">GEMM</text>
<rect x="875" y="230" width="80" height="49" fill="#bdafcf" stroke="#f4f7fb" stroke-width="2"/>
<text x="915.0" y="261" text-anchor="middle" font-size="17">合并</text>
<text x="977" y="318" font-size="17">ms</text>
<text x="35" y="365" font-size="20">dispatch 区间：rank 0 为 4 ms，rank 1 为 1 ms；GEMM 都是 3 ms。</text>
<text x="35" y="401" font-size="18">额外的 3 ms 来自 rank 1 晚就绪，不能归成 rank 0 的链路传输慢。</text>
<text x="35" y="437" font-size="16">图为可复算依赖模型，非实测 trace；真实通信可以分块传输并与计算重叠。</text>
</g></svg>

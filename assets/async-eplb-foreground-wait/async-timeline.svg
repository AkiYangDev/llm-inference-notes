<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-labelledby="title desc">
<title id="title">后台传输隐藏到五次正常 forward 中，前台仍保留提交时间</title>
<desc id="desc">教学时间线。每轮forward十毫秒，传输二十五毫秒，提交两毫秒。同步完成于七十七毫秒，理想异步完成于五十二毫秒，无更新基线五十毫秒。</desc>

<path d="M545.5,347 H598.0 V284" fill="none" stroke="#a37b2e" stroke-width="2" stroke-dasharray="5,4"/>
<text x="630" y="366" font-size="16">缓冲保留到安全提交边界</text>
<text x="30" y="472" font-size="17">异步前台 F2～F4 继续用旧布局；F4 结束后提交，F5 使用新布局。</text>
<text x="30" y="508" font-size="15" fill="#526576">图为理想教学模型，不是设备 profiling 或服务吞吐实测。两种更新方案在观察结束前都已提交。</text>

<line x1="808.0" y1="103" x2="808.0" y2="415" stroke="#dce2e8"/><text x="803.0" y="98" font-size="15">60</text>
<line x1="913.0" y1="103" x2="913.0" y2="415" stroke="#dce2e8"/><text x="908.0" y="98" font-size="15">70</text>
<line x1="1018.0" y1="103" x2="1018.0" y2="415" stroke="#dce2e8"/><text x="1013.0" y="98" font-size="15">80</text>
<text x="1040" y="99" font-size="15">ms</text>
<text x="25" y="167" font-size="20">同步 · 前台</text>
<text x="25" y="269" font-size="20">异步 · 前台</text>
<text x="25" y="334" font-size="20">异步 · 后台</text>
<text x="25" y="415" font-size="20">无更新 · 基线</text>

<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#263746">
<text x="30" y="42" font-size="25" font-weight="600">相同五次 forward，传输可以重叠，提交仍要排进前台</text>
<text x="30" y="74" font-size="17" fill="#526576">教学设定：forward 10 ms，传输 25 ms，提交 2 ms；忽略统计、规划、协调及资源争用</text>

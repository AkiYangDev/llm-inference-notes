<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="654" viewBox="0 0 1040 654" role="img" aria-labelledby="title desc">
<title id="title">算法只用总量时，可以先消掉记录轴</title><desc id="desc">优化设计示意：W1000 / L43 / E256；容量不是设备时延</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61778c"/></marker></defs>
<rect width="1040" height="654" rx="20" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#163047">
<text x="40" y="48" text-anchor="start" font-size="28" font-weight="bold" fill="#163047">算法只用总量时，可以先消掉记录轴</text>
<text x="40" y="83" text-anchor="start" font-size="17" font-weight="normal" fill="#536779">优化设计示意：W1000 / L43 / E256；容量不是设备时延</text>
<rect x="60" y="120" width="430" height="146" rx="12" fill="#e5f1fa" stroke="#6aa1c3" stroke-width="1.5"/>
<text x="80" y="153" text-anchor="start" font-size="21" font-weight="bold" fill="#163047">完整逐记录输入</text>
<text x="275.0" y="184" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">[1000,43,256] int32</text>
<text x="275.0" y="215" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">44032000 B / rank</text>
<text x="275.0" y="246" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">约 41.99 MiB</text>
<rect x="550" y="120" width="430" height="146" rx="12" fill="#e5f4f0" stroke="#65a998" stroke-width="1.5"/>
<text x="570" y="153" text-anchor="start" font-size="21" font-weight="bold" fill="#163047">紧凑累计输入</text>
<text x="765.0" y="184" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">本地沿 W 求和，使用 int64</text>
<text x="765.0" y="215" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">[43,256] = 88064 B / rank</text>
<text x="765.0" y="246" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">86 KiB</text>
<path d="M290,266 L290,281" stroke="#61778c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<path d="M750,266 L750,281" stroke="#61778c" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="284" width="430" height="108" rx="12" fill="#e5f1fa" stroke="#6aa1c3" stroke-width="1.5"/>
<text x="275.0" y="329.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">all-reduce 后再沿 W 求和</text>
<text x="275.0" y="360.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">只用总量的 planner 取 [43,256]</text>
<rect x="550" y="284" width="430" height="108" rx="12" fill="#e5f4f0" stroke="#65a998" stroke-width="1.5"/>
<text x="765.0" y="329.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">all-reduce 紧凑张量</text>
<text x="765.0" y="360.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">planner 取得相同精确整数总量</text>
<rect x="60" y="445" width="920" height="104" rx="12" fill="#fff1dd" stroke="#d0a164" stroke-width="1.5"/>
<text x="520.0" y="488.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">输入容量缩小 500 倍：1000 条 × 4 B → 1 条 × 8 B</text>
<text x="520.0" y="519.5" text-anchor="middle" font-size="21" font-weight="normal" fill="#163047">逐记录算法与文件导出仍保留完整记录</text>
<text x="40" y="629" text-anchor="start" font-size="16" font-weight="normal" fill="#536779">不是已合入改动；没有改变原环形 buffer，也没有给出 NPU 性能收益。</text>
</g></svg>

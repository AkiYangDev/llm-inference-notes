<text x="120" y="352">0</text><text x="245" y="352">2</text><text x="370" y="352">4</text><text x="495" y="352">6</text><text x="620" y="352">8</text><text x="745" y="352">10</text><text x="870" y="352">12 s</text>
</g>
<text x="890" y="210" font-size="15" fill="#2578b9">入选</text><text x="890" y="253" font-size="15" fill="#2578b9">入选</text><text x="890" y="296" font-size="15" fill="#2578b9">入选</text>
<text x="36" y="392" font-size="16">C / D / E 各输出 100 token：原生结果 300 ÷ 4 = 75 token/s，E 的结束时间超出选样区间。</text>

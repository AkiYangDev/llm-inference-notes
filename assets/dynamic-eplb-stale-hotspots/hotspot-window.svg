<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">同一次热点切换，W1000 与 W4000 看到不同的历史</title>
  <desc id="desc">教学示意。稳定阶段检查点为第4000条，B从3401条变热。W1000含400条旧业务和600条新业务，B路由占58%；W4000含3400条旧业务和600条新业务，B占22%。之后还要完成update。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#637184"/></marker></defs>
  <rect width="1100" height="500" rx="14" fill="#f4f6f8"/>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#273747">
    <text x="36" y="46" font-size="25" font-weight="600">同一个检查点，窗口留下的旧业务差了 3000 条</text>
    <text x="36" y="77" font-size="17" fill="#5d6d7e">教学设定：每条记录 100 次路由；第 3401 条起，热点从 A 切到 B</text>
    <line x1="170" y1="132" x2="860" y2="132" stroke="#637184" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="16"><text x="170" y="119">1</text><text x="650" y="119">3001</text><text x="719" y="157">3401：B 变热</text><text x="834" y="119">4000</text></g>
    <line x1="758" y1="128" x2="758" y2="335" stroke="#b06a24" stroke-dasharray="5,5"/>
    <line x1="860" y1="125" x2="860" y2="344" stroke="#637184" stroke-dasharray="5,5"/>
    <text x="36" y="211" font-size="22">W1000</text>
    <rect x="170" y="180" width="520" height="48" rx="4" fill="#e5e9ee"/>
    <text x="270" y="211" font-size="17" fill="#637184">早期记录已被覆盖</text>
    <rect x="690" y="180" width="68" height="48" fill="#8ba6c7"/>
    <rect x="758" y="180" width="102" height="48" fill="#d8aa54"/>
    <text x="895" y="209" font-size="23" font-weight="600">B 占 58%</text>
    <text x="552" y="255" font-size="17">400 条旧业务 + 600 条新业务</text>
    <text x="36" y="308" font-size="22">W4000</text>
    <rect x="170" y="277" width="588" height="48" fill="#8ba6c7"/>
    <rect x="758" y="277" width="102" height="48" fill="#d8aa54"/>
    <text x="895" y="307" font-size="23" font-weight="600">B 占 22%</text>
    <text x="478" y="353" font-size="17">3400 条旧业务 + 600 条新业务</text>
    <rect x="170" y="384" width="18" height="18" fill="#8ba6c7"/><text x="200" y="400" font-size="16">旧业务：A90 / B10</text>
    <rect x="455" y="384" width="18" height="18" fill="#d8aa54"/><text x="485" y="400" font-size="16">新业务：A10 / B90</text>
    <path d="M860,346 V422 H1010" fill="none" stroke="#637184" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="710" y="451" font-size="17">读出统计 → 规划与搬运 → 新布局生效</text>
    <text x="36" y="478" font-size="15" fill="#637184">颜色表示记录来自哪段业务；右侧百分比表示路由量。图为教学示意，并非服务 trace。</text>
  </g>
</svg>

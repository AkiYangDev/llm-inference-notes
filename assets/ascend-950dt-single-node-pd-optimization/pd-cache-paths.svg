<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">单机 PD 与缓存路径</title><desc id="desc">P 和 D 分别负责输入处理与生成，设备前缀缓存保留；HiCache 主机缓存路径关闭，P 到 D 的状态交接继续。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878d0"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker></defs><rect width="960" height="730" rx="20" fill="#f5f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="48" font-size="28" fill="#18334b" font-weight="700" text-anchor="start">同一台机器，三种不同的职责</text><text x="40" y="82" font-size="19" fill="#536c82" font-weight="400" text-anchor="start">逻辑分工示意 · 请求协调、设备复用与 P→D 交接分别观察</text><rect x="355" y="115" width="250" height="76" rx="14" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="480" y="148" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">Router</text><text x="480" y="176" font-size="18" fill="#536c82" font-weight="400" text-anchor="middle">接收请求与协调两端</text><path d="M 395 191 V 213 H 250 V 249" fill="none" stroke="#2878d0" stroke-width="3" marker-end="url(#blue)"/><path d="M 565 191 V 213 H 710 V 249" fill="none" stroke="#2878d0" stroke-width="3" marker-end="url(#blue)"/><text x="145" y="235" font-size="17" fill="#2878d0" font-weight="400" text-anchor="start">请求协调</text><text x="605" y="235" font-size="17" fill="#2878d0" font-weight="400" text-anchor="start">请求协调</text><rect x="65" y="250" width="355" height="110" rx="14" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="242" y="287" font-size="26" fill="#2878d0" font-weight="700" text-anchor="middle">P · Prefill</text><text x="242" y="322" font-size="20" fill="#18334b" font-weight="400" text-anchor="middle">处理新输入，准备缓存状态</text><rect x="540" y="250" width="355" height="110" rx="14" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="717" y="287" font-size="26" fill="#087f83" font-weight="700" text-anchor="middle">D · Decode</text><text x="717" y="322" font-size="20" fill="#18334b" font-weight="400" text-anchor="middle">接收状态，推进后续生成</text><path d="M 425 307 H 534" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)"/><text x="480" y="284" font-size="17" fill="#087f83" font-weight="400" text-anchor="middle">状态交接</text><path d="M 240 438 V 369" fill="none" stroke="#2878d0" stroke-width="3" marker-end="url(#blue)"/><text x="260" y="410" font-size="18" fill="#2878d0" font-weight="400" text-anchor="start">设备前缀复用</text><rect x="65" y="440" width="355" height="80" rx="14" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="242" y="476" font-size="23" fill="#2878d0" font-weight="700" text-anchor="middle">设备 KV 缓存 · 保留</text><text x="242" y="505" font-size="18" fill="#536c82" font-weight="400" text-anchor="middle">命中前缀继续复用</text><path d="M 717 367 V 433" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)"/><rect x="540" y="440" width="355" height="80" rx="14" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="717" y="475" font-size="23" fill="#087f83" font-weight="700" text-anchor="middle">DSPARK 持续生成</text><text x="717" y="505" font-size="18" fill="#536c82" font-weight="400" text-anchor="middle">draft → verify → 提交</text><path d="M 240 520 V 563" stroke="#a7b4be" stroke-width="2" stroke-dasharray="6 5"/><path d="M 230 537 L 250 555 M 250 537 L 230 555" stroke="#b86427" stroke-width="3"/><rect x="65" y="575" width="355" height="77" rx="14" fill="#fff3e9" stroke="#cd9873" stroke-width="2" stroke-dasharray="7 6"/><text x="242" y="607" font-size="22" fill="#b86427" font-weight="700" text-anchor="middle">HiCache 主机缓存 · 关闭</text><text x="242" y="636" font-size="18" fill="#536c82" font-weight="400" text-anchor="middle">移除额外缓存层的路径</text><text x="540" y="594" font-size="21" fill="#18334b" font-weight="700" text-anchor="start">HiCache 关闭后，</text><text x="540" y="629" font-size="21" fill="#18334b" font-weight="700" text-anchor="start">必要的 P→D 交接仍然保留。</text><text x="40" y="697" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">单机 PD 不等于没有交接；关闭主机缓存也不等于关闭前缀复用。</text></g></svg>

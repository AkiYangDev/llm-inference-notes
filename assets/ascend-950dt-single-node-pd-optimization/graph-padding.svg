<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">图捕获档位与padding</title><desc id="desc">在最近向上档位假设下，实际BS5在旧档位补到16，新档位补到6，填充槽位从11降到1。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878d0"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker></defs><rect width="960" height="540" rx="20" fill="#f5f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="48" font-size="27" fill="#18334b" font-weight="700" text-anchor="start">图档位更接近实际 batch，可以少填充一些槽位</text><text x="40" y="82" font-size="19" fill="#536c82" font-weight="400" text-anchor="start">示例：实际 BS = 5，runner 选择不小于它的最近捕获档位</text><text x="40" y="166" font-size="24" fill="#18334b" font-weight="700" text-anchor="start">旧档位</text><text x="40" y="197" font-size="19" fill="#536c82" font-weight="400" text-anchor="start">1 / 2 / 4 / 16</text><text x="40" y="296" font-size="24" fill="#18334b" font-weight="700" text-anchor="start">新档位</text><text x="40" y="327" font-size="19" fill="#536c82" font-weight="400" text-anchor="start">加入 6 / 8 / …</text><rect x="265" y="145" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="303" y="145" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="341" y="145" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="379" y="145" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="417" y="145" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="455" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="493" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="531" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="569" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="607" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="645" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="683" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="721" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="759" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="797" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="835" y="145" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><rect x="265" y="275" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="303" y="275" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="341" y="275" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="379" y="275" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="417" y="275" width="30" height="54" rx="5" fill="#2878d0" stroke="#2878d0" stroke-width="2"/><rect x="455" y="275" width="30" height="54" rx="5" fill="#dbe5ed" stroke="#c3d0db" stroke-width="2"/><text x="265" y="232" font-size="20" fill="#536c82" font-weight="400" text-anchor="start">捕获 BS 16：5 个真实请求 + 11 个填充槽位</text><text x="265" y="362" font-size="20" fill="#087f83" font-weight="700" text-anchor="start">捕获 BS 6：5 个真实请求 + 1 个填充槽位</text><rect x="40" y="400" width="880" height="69" rx="14" fill="#fff" stroke="#d9e4ed" stroke-width="2"/><text x="480" y="442" font-size="20" fill="#18334b" font-weight="400" text-anchor="middle">图的最大 BS ≠ 客户端并发上限；本地 batch 还受 DP 与执行阶段影响。</text><text x="40" y="509" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">蓝色：真实请求槽位    灰色：padding    ·    槽位减少比例不是实测加速比</text></g></svg>

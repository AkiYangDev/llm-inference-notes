<svg xmlns="http://www.w3.org/2000/svg" width="960" height="656" viewBox="0 0 960 656" role="img" aria-labelledby="title desc"><title id="title">投机解码的候选验证与提交</title><desc id="desc">示意6个候选，前4个通过，第5个拒绝，后缀不提交。提交的有效token数与周期时间共同决定收益。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878d0"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker></defs><rect width="960" height="656" rx="20" fill="#f5f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="48" font-size="28" fill="#18334b" font-weight="700" text-anchor="start">一次验证，确定可以向前推进多远</text><text x="40" y="82" font-size="19" fill="#536c82" font-weight="400" text-anchor="start">概念示意 · 6 个候选中前 4 个通过，不是本次实测接受长度</text><text x="45" y="168" font-size="25" fill="#18334b" font-weight="700" text-anchor="start">Draft</text><text x="45" y="199" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">准备候选</text><text x="45" y="303" font-size="25" fill="#18334b" font-weight="700" text-anchor="start">Verify</text><text x="45" y="334" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">验证可提交前缀</text><text x="45" y="448" font-size="25" fill="#18334b" font-weight="700" text-anchor="start">Commit</text><text x="45" y="479" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">保留有效结果</text><rect x="268" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="306" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t1</text><rect x="268" y="275" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="306" y="315" font-size="20" fill="#087f83" font-weight="700" text-anchor="middle">通过</text><rect x="268" y="420" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="306" y="461" font-size="25" fill="#087f83" font-weight="700" text-anchor="middle">t1</text><rect x="362" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="400" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t2</text><rect x="362" y="275" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="400" y="315" font-size="20" fill="#087f83" font-weight="700" text-anchor="middle">通过</text><rect x="362" y="420" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="400" y="461" font-size="25" fill="#087f83" font-weight="700" text-anchor="middle">t2</text><rect x="456" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="494" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t3</text><rect x="456" y="275" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="494" y="315" font-size="20" fill="#087f83" font-weight="700" text-anchor="middle">通过</text><rect x="456" y="420" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="494" y="461" font-size="25" fill="#087f83" font-weight="700" text-anchor="middle">t3</text><rect x="550" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="588" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t4</text><rect x="550" y="275" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="588" y="315" font-size="20" fill="#087f83" font-weight="700" text-anchor="middle">通过</text><rect x="550" y="420" width="76" height="64" rx="10" fill="#e2f5f2" stroke="#087f83" stroke-width="2"/><text x="588" y="461" font-size="25" fill="#087f83" font-weight="700" text-anchor="middle">t4</text><rect x="644" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="682" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t5</text><rect x="644" y="275" width="76" height="64" rx="10" fill="#fff3e9" stroke="#b86427" stroke-width="2"/><text x="682" y="315" font-size="20" fill="#b86427" font-weight="700" text-anchor="middle">拒绝</text><rect x="738" y="140" width="76" height="64" rx="10" fill="#e8f1fc" stroke="#2878d0" stroke-width="2"/><text x="776" y="181" font-size="25" fill="#2878d0" font-weight="700" text-anchor="middle">t6</text><rect x="738" y="275" width="76" height="64" rx="10" fill="#e9eef2" stroke="#536c82" stroke-width="2"/><text x="776" y="315" font-size="20" fill="#536c82" font-weight="700" text-anchor="middle">后缀</text><path d="M 538 211 V 263" fill="none" stroke="#2878d0" stroke-width="3" marker-end="url(#blue)"/><path d="M 447 346 V 406" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#teal)"/><text x="738" y="377" font-size="18" fill="#b86427" font-weight="400" text-anchor="middle">拒绝位置及后缀不提交</text><text x="665" y="455" font-size="21" fill="#087f83" font-weight="700" text-anchor="start">从接受边界继续</text><rect x="40" y="525" width="880" height="64" rx="14" fill="#fff" stroke="#d9e4ed" stroke-width="2"/><text x="480" y="565" font-size="23" fill="#18334b" font-weight="700" text-anchor="middle">有效产出看“提交数 / 周期时间”，不能只看候选数。</text><text x="40" y="626" font-size="18" fill="#536c82" font-weight="400" text-anchor="start">为突出接受边界，图中省略修正或额外 token 的处理。</text></g></svg>

name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_docs.py --strict-style
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r site/requirements.txt
      - name: Build and validate reading site
        run: |
          python3 scripts/check_math.py
          python3 site/build.py
          python3 scripts/check_site.py
          node scripts/check_search.mjs
          node --input-type=module --check < site/assets/app.js
